name: Feature request
description: Suggest something adifedit should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        adifedit has a deliberately narrow purpose: editing the ADIF file in
        front of you, and nothing outside it (no logging, uploads, lookups
        or rig control). Please read "Purpose and scope" in the README and
        "Scope" in CONTRIBUTING.md first.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do with your log that adifedit makes hard?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you picture it working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How you do it today (optional)
      description: Another program, a script, by hand ...
